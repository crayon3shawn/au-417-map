     為什麼要獨立一頁：那些內容原本散在兩頁的下半部，而且是**同一套東西寫了
     兩遍**（州頁「三個重點」與入口頁三則說明講同一件事，fact2_head 跟
     p_note2_h 連標題都一樣叫「災區是另一條路」）。更要緊的是它們**常駐**：
     1823 個「一般工作本來就算」的郵區（67%）的使用者查完答案，還要滾過
     八百字跟他無關的災害說明。

     實際量過：面板上的判定本身只有 98 字，兩頁的說明加起來 2171 字。 -->
