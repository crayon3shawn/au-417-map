<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>__TOKENS__
__CSS__</style>

<div class="devbar" id="devbar" hidden></div>
<div class="shell">
  <header class="bar">
    <h1>__TITLE__</h1>
    <span class="sub"><span data-t="subtitle"></span> · <span id="subind"></span></span>
    <span class="spacer"></span>
    <nav class="nav" id="nav" aria-label="切換地圖"></nav>
    <button class="lang" id="lang" type="button"></button>
  </header>
  <p class="disclaim" data-t="disclaimer"></p>
  <div class="hdrspacer">
  </div>

  <div class="main">
    <aside class="rail">
      <section class="blk">
        <span class="eyebrow" data-t="industry_label"></span>
        <select id="ind" class="ind" aria-label="選擇產業"></select>
        <p class="indnote" id="indnote"></p>
      </section>

      <section class="blk">
        <span class="eyebrow" data-t="search_label"></span>
        <div class="srch">
          <input id="q" maxlength="30" placeholder="4870 或 Cairns" autocomplete="off"
                 aria-label="輸入郵遞區號或地名" aria-describedby="qhint">
        </div>
        <p class="qhint" id="qhint"></p>
        <div class="hits" id="hits" role="listbox" aria-label="搜尋結果"></div>
      </section>

      <section class="blk">
        <span class="eyebrow" data-t="detail_label"></span>
        <div class="card" id="detail" role="status" aria-live="polite">
          <div class="empty" data-t="detail_empty"></div>
        </div>
      </section>

      <section class="blk">
        <span class="eyebrow" data-t="facts_title"></span>
        <div class="facts">
          <p><b data-t="fact1_head"></b> <span id="fact1"></span><span id="excluded"></span></p>
          <p><b data-t="fact2_head"></b> <span data-t="fact2_body"></span></p>
          <p><b data-t="fact3_head"></b> <span data-t="fact3_body"></span></p>
        </div>
      </section>

      <section class="blk">
        <span class="eyebrow" data-t="source_title"></span>
        <div class="src">
          本圖只處理 <b>417</b>（Working Holiday）；462 的產業規則不同，不適用。
          郵遞區號清單逐字取自
          <a href="https://immi.homeaffairs.gov.au/visas/getting-a-visa/visa-listing/work-holiday-417/specified-work" target="_blank" rel="noopener">Home Affairs — Specified work (subclass 417)</a>（頁面標示更新於 2026 年 8 月 18 日）。
          郵區範圍為 ABS Postal Areas 2021 概化邊界，僅供判讀，非法定界線；
          個別災害的宣告範圍與日期請對
          <a href="https://www.disasterassist.gov.au/find-a-disaster" target="_blank" rel="noopener">Disaster Assist — Find a disaster</a> 查證。
          有 8 個合格郵區在 ABS 沒有對應面（多為信箱型郵區），以小點標示。
          送件前務必以官方頁面為準。
          <span class="stamp" id="stamp"></span>
        </div>
      </section>
    </aside>

    <div class="mapwrap" id="mapwrap">
      <svg class="map" id="map" aria-labelledby="maptitle"></svg>
      <details class="legend" id="legend">
        <summary class="eyebrow"><span data-t="legend_title"></span>
          <span class="mini" aria-hidden="true">
            <i style="--sw:var(--c-work)"></i><i style="--sw:var(--c-rebuild)"></i><i style="--sw:var(--c-none)"></i>
          </span>
        </summary>
        <div class="lg" style="--sw:var(--c-work)"><i></i><span id="n-work-label">一般工作就算</span><b id="n-work"></b></div>
        <div class="lg" id="r-rebuild" style="--sw:var(--c-rebuild)"><i></i><span data-t="cat_rebuild"></span><b id="n-rebuild"></b></div>
        <div class="lg split" style="--sw:var(--c-fire)"><i></i><span data-t="cat_fire_only"></span><b id="n-fire"></b></div>
        <div class="lg split" style="--sw:var(--c-flood)"><i></i><span data-t="cat_flood_only"></span><b id="n-flood"></b></div>
        <div class="lg split" style="--sw:var(--c-both)"><i></i><span data-t="cat_both"></span><b id="n-both"></b></div>
        <div class="lg" id="r-none" style="--sw:var(--c-none)"><i></i><span data-t="cat_none"></span><b id="n-none"></b></div>
        <label class="lgtoggle"><input type="checkbox" id="split"><span data-t="split_toggle"></span></label>
        <div class="lgnote" data-t="legend_note"></div>
      </details>
      <div class="tip" id="tip"></div>
      <div class="zoom">
        <button type="button" id="zin" aria-label="放大">＋</button>
        <button type="button" id="zout" aria-label="縮小">−</button>
        <button type="button" id="zrst" aria-label="回到全州視野" title="回到全州視野">⤢</button>
      </div>
    </div>
  </div>
</div>

<script>
__JS__
</script>
