<meta name="viewport" content="width=device-width, initial-scale=1">
__ROBOTS__<title>__TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>__TOKENS__
__CSS__</style>
<script>__THEME__</script>

<div class="devbar" id="devbar" hidden></div>
<div class="shell">
  <header class="topbar" id="bar">
    <a class="mark" href="index.html" data-t-aria="nav_home">417</a>
    <h1 id="h1"></h1>
    <span class="sub"><span data-t="subtitle"></span> · <span id="subind"></span></span>
    <span class="spacer"></span>
    <nav class="nav" id="nav" data-t-aria="nav_aria"></nav>
    <button class="lang" id="theme" type="button" data-t-aria="theme_toggle"></button>
    <button class="lang" id="lang" type="button"></button>
  </header>
  <p class="disclaim" data-t="disclaimer"></p>
  <div class="hdrspacer">
  </div>

  <div class="main">
    <div class="railwrap">
    <aside class="rail rail-a">
      <section class="blk">
        <span class="eyebrow" data-t="industry_label"></span>
        <select id="ind" class="ind" data-t-aria="p_ind_aria"></select>
        <div class="card indcard" id="indnote"></div>
      </section>

      <section class="blk">
      <!-- 查詢欄與答案是同一個物件。你輸入的郵遞區號、跟你在問的那個，是同一個
           東西——現在畫面上它出現兩次（欄位裡一次、答案標題再一次）。合成一個
           之後答案就出現在眼睛本來就在的位置，而那四個數字（澳洲簽證世界的原子
           單位）變成整頁最大的東西。
           原本答案上面還有一個「郵區詳情」標籤，併起來之後是多的：它就長在查詢欄
           下面，不需要有人告訴你這是什麼。
           .fbox 沒有 gap，欄位與答案共用一個外框；候選清單排在整個盒子之後。 -->
        <span class="eyebrow" data-t="search_label"></span>
        <div class="fbox">
          <div class="srch">
            <input id="q" maxlength="30" autocomplete="off" aria-describedby="qhint"
                   data-t-ph="search_ph" data-t-aria="p_q_aria">
          </div>
          <div class="detail" id="detail" role="status" aria-live="polite">
            <div class="empty" data-t="detail_empty"></div>
          </div>
        </div>
        <p class="qhint" id="qhint"></p>
        <div class="hits" id="hits" role="listbox" data-t-aria="p_hits_aria"></div>
      </section>

    </aside>

    <aside class="rail rail-b">
      <section class="blk">
        <span class="eyebrow" data-t="facts_title"></span>
        <div class="facts">
          <p><b data-t="fact1_head"></b> <span id="fact1"></span><span id="excluded"></span></p>
          <p><b data-t="fact2_head"></b> <span data-t="fact2_body"></span></p>
          <p><b data-t="fact3_head"></b> <span data-t="fact3_body"></span></p>
        </div>
      </section>

      <section class="blk">
        <span class="eyebrow" data-t="source_title"></span>
        <div class="src">
          <span id="srctext"></span>
          <span class="stamp" id="stamp"></span>
        </div>
      </section>
    </aside>
    </div>

    <div class="mapwrap" id="mapwrap">
      <svg class="map" id="map" aria-labelledby="maptitle"></svg>
      <details class="legend" id="legend">
        <summary class="eyebrow"><span data-t="legend_title"></span>
          <span class="mini" aria-hidden="true">
            <i id="mini-in"></i><i style="--sw:var(--c-none)"></i>
          </span>
        </summary>
        <!-- 一次只看一張表。三個檢視的順序是刻意的：第一個跟著產業走（建築＝
             Regional Australia），那是絕大多數人要看的；兩張災害表排在後面，
             它們是「一般工作不算時的另一條路」。
             每個檢視只有兩色——在這張表上、不在。原本的三色判定把「算不算」
             和「哪一張表」壓在同一個軸上，掃視時資訊量反而低。 -->
        <div class="seg" role="group" data-t-aria="view_group">
          <button type="button" id="v-work" data-t="view_work" aria-pressed="true"></button>
          <button type="button" id="v-fire" data-t="view_fire" aria-pressed="false"></button>
          <button type="button" id="v-flood" data-t="view_flood" aria-pressed="false"></button>
        </div>
        <div class="lg" id="r-in"><i></i><span id="n-in-label"></span><b id="n-in"></b></div>
        <div class="lg" style="--sw:var(--c-none)"><i></i><span data-t="leg_out"></span><b id="n-out"></b></div>
        <!-- 「不在這張表上」的那些，有多少其實還有另一條路。用文字回答
             「我是不是漏看了什麼」，不引入第二個顏色軸——一次一張表的前提
             才守得住。點一下直接切到那張表。 -->
        <div class="lghint" id="lghint"></div>
        <div class="lgnote" id="lgsrc"></div>
        <div class="lgnote" data-t="legend_note"></div>
      </details>
      <div class="tip" id="tip"></div>
      <div class="zoom">
        <button type="button" id="zin" data-t-aria="zoom_in">＋</button>
        <button type="button" id="zout" data-t-aria="zoom_out">−</button>
        <button type="button" id="zrst" data-t-aria="reset_view" data-t-title="reset_view">⤢</button>
      </div>
    </div>
  </div>
</div>
