<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
__ROBOTS__<title>澳洲 417 集簽地圖 · Australia 417 Visa Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>__TOKENS__
__CSS__</style>

<!-- 文字一律由 portal.js 從 strings.json 填入，兩種語言共用同一份樣板。
     data-t 是內容，data-t-ph／data-t-aria 是屬性。這裡不寫死任何一種語言的
     字，否則改字要改兩個地方，遲早會漂掉。 -->
<div class="devbar" id="devbar" hidden></div>
<div class="wrap">
  <header>
    <button class="lang" id="lang" type="button"></button>
    <h1 data-t="p_title"></h1>
    <p class="lede"><span data-t="p_lede"></span>
      <span class="lede-note" data-t="p_lede_note"></span></p>
    <p class="disclaim" id="disclaim"></p>
  </header>

  <section class="finder">
    <div class="indrow">
      <label for="ind" data-t="industry_label"></label>
      <select id="ind" data-t-aria="p_ind_aria"></select>
      <span id="indnote"></span>
    </div>
    <span class="eyebrow" data-t="search_label"></span>
    <div class="qrow">
      <input id="q" maxlength="30" autocomplete="off"
             data-t-ph="search_ph" data-t-aria="p_q_aria">
    </div>
    <div class="result" id="result" role="status" aria-live="polite">
      <p class="hint" id="hint"></p>
    </div>
    <div class="hits" id="hits" role="listbox" data-t-aria="p_hits_aria"></div>
  </section>

  <div class="cols">
    <section class="panel mapbox">
      <span class="eyebrow" data-t="p_eyebrow_maps"></span>
      <svg class="au" id="au" aria-labelledby="autitle"></svg>
    </section>
    <section class="panel">
      <span class="eyebrow" data-t="p_eyebrow_dist"></span>
      <div class="cards" id="cards"></div>
    </section>
  </div>

  <section class="basis">
    <h2 data-t="p_basis_h2"></h2>
    <p class="basis-lede" data-t="p_basis_lede"></p>

    <div class="cov" id="cov"></div>

    <p class="basis-note2" id="basisnote"></p>

    <div class="tblwrap">
      <table class="imap" id="imap">
        <thead><tr>
          <th data-t="p_th_industry"></th>
          <th data-t="p_th_table"></th>
          <th data-t="p_th_scope"></th>
        </tr></thead>
        <tbody></tbody>
      </table>
    </div>

    <p class="basis-note" id="samelist"></p>

    <div class="prov">
      <h3 data-t="p_prov_h3"></h3>
      <ul>
        <li data-t="p_prov1"></li>
        <li data-t="p_prov2"></li>
        <li data-t="p_prov3"></li>
        <li data-t="p_prov4"></li>
      </ul>
    </div>
  </section>

  <div class="notes">
    <div>
      <h3 data-t="p_note1_h"></h3>
      <p data-t="p_note1_b"></p>
    </div>
    <div>
      <h3 data-t="p_note2_h"></h3>
      <p data-t="p_note2_b"></p>
    </div>
    <div>
      <h3 data-t="p_note3_h"></h3>
      <p data-t="p_note3_b"></p>
    </div>
    <div>
      <h3 data-t="p_note4_h"></h3>
      <p id="note4"></p>
      <p class="stamp" id="stamp"></p>
    </div>
  </div>
</div>

<script>
__JS__
</script>
