# 定期去 Home Affairs 看郵區清單有沒有改。
#
# 為什麼要有這個：郵區清單是這個站台唯一的事實來源，官網改了而我們不知道，
# 頁面就會安靜地給出過期的答案——沒有錯誤訊息，沒有徵兆，使用者照著做才發現。
# 與其等人回報，不如讓 GitHub 每週去看一眼。
#
# 沒變就什麼都不做：不 commit、不開 PR、不發通知。
# fetch/postcodes.py 每次都會重寫 fetched_at，所以「有沒有變」不能用 git diff 判斷,
# 要用 diff_postcodes.py 比對展開後的郵區集合（官網把 "4307, 4308" 改寫成
# "4307 to 4308" 時郵區其實沒變，那種噪音不該吵醒任何人）。
#
# 這個 workflow 不碰站台：它只開 PR，部署仍然是 pages.yml 在 main 上做的。
name: 郵區資料健檢

on:
  schedule:
    - cron: '0 1 * * 1'      # 每週一 01:00 UTC（台北 09:00）
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: data-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      # 健檢不過（少了一張表、某州郵區數變動超過 10%、範圍字串解析不出來）
      # 就不寫入並回傳 1，這一步直接失敗——那種情況要人看，不要自動開 PR。
      - name: 抓取官網並健檢
        run: python3 fetch/postcodes.py --keep-raw

      # 抓下來的原始 HTML 留著。官網改版型時，這是唯一能看出「他們把表格
      # 搬到哪去了」的東西；失敗後才想抓就已經是改版後的頁面了。
      - name: 失敗時保留原始 HTML
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: homeaffairs-raw-html
          path: data/raw/
          retention-days: 30

      - name: 比對有沒有實質變動
        id: diff
        run: |
          set +e
          python3 diff_postcodes.py --restore > /tmp/diff.md
          code=$?
          set -e
          cat /tmp/diff.md
          case $code in
            0) echo "changed=false" >> "$GITHUB_OUTPUT" ;;
            1) echo "changed=true"  >> "$GITHUB_OUTPUT" ;;
            *) echo "比對失敗（離開碼 $code）"; exit $code ;;
          esac

      - name: 沒變動就到此為止
        if: steps.diff.outputs.changed == 'false'
        run: |
          echo "### 官網無變動 ✅" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/diff.md >> "$GITHUB_STEP_SUMMARY"

      # 資料變了不代表建得起來——例如新郵區在 ABS 邊界資料裡沒有對應面。
      # 結果寫進 PR 內文，不在這裡中斷：PR 本身還是要開出來給人看。
      - name: 變動後試建並跑測試
        id: build
        if: steps.diff.outputs.changed == 'true'
        run: |
          if make all > /tmp/build.log 2>&1 && make test >> /tmp/build.log 2>&1; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi
          tail -30 /tmp/build.log

      - name: 開 PR
        id: pr
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          BRANCH="data/postcodes-$(date -u +%Y%m%d)"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 同一天跑第二次時遠端已有同名分支。actions/checkout 預設只抓一個 ref，
          # 沒先 fetch 的話 --force-with-lease 會因為 stale info 失敗，
          # 連帶把整個 job 弄紅——那是假警報，不是官網出事。
          git fetch origin "$BRANCH" || true
          git checkout -B "$BRANCH"
          git add data/postcodes.json
          git commit -m "郵區資料：官網有變動（$(date -u +%Y-%m-%d) 自動抓取）"
          git push -u origin "$BRANCH" --force-with-lease

          if [ "${{ steps.build.outputs.ok }}" = "true" ]; then
            BUILD="✅ \`make all\` 與 \`make test\` 都通過。"
          else
            BUILD="❌ **\`make all\` 或 \`make test\` 失敗** — 合併前要先修。log 在這次 workflow run 裡。"
          fi

          {
            echo "自動抓取發現 Home Affairs 的指定地區表有變動。"
            echo
            echo "## 改了什麼"
            echo
            cat /tmp/diff.md
            echo
            echo "## 建置結果"
            echo
            echo "$BUILD"
            echo
            echo "## 合併前請確認"
            echo
            echo "- [ ] 到[官網 417 頁](https://immi.homeaffairs.gov.au/visas/getting-a-visa/visa-listing/work-holiday-417/specified-work)人工核對上面列的改動"
            echo "- [ ] 確認不是官網暫時性的錯誤或改版殘留"
            echo "- [ ] 如果是災區宣告的變動，順便看看 \`data/industries.json\` 的日期門檻要不要跟著改"
            echo
            echo "> 這份 diff 比的是展開後的郵區集合，不是字串。只改寫法（逗號換分號、"
            echo "> 逐號列出改成範圍）而郵區沒變的情況不會觸發這個 PR。"
          } > /tmp/body.md

          open_prs=$(gh pr list --head "$BRANCH" --state open --json number --jq 'length')
          if [ "$open_prs" != "0" ]; then
            echo "同名分支已有開著的 PR（$open_prs 個），只更新分支內容。"
          else
            gh pr create --base main --head "$BRANCH" \
              --title "郵區資料：官網有變動（$(date -u +%Y-%m-%d)）" \
              --body-file /tmp/body.md \
            || {
              echo "::warning::PR 開不出來（多半是 repo 設定沒開放 Actions 建立 PR）。"
              echo "分支 $BRANCH 已經推上去了，手動開 PR 即可："
              echo "https://github.com/${{ github.repository }}/compare/main...$BRANCH?expand=1"
            }
          fi

          cat /tmp/body.md >> "$GITHUB_STEP_SUMMARY"

      # 最後才失敗：PR 已經開好了，但建置壞掉這件事要讓你收到通知。
      - name: 建置失敗就讓這次 run 紅燈
        if: steps.diff.outputs.changed == 'true' && steps.build.outputs.ok != 'true'
        run: |
          echo "資料已開 PR，但 make all / make test 沒過，需要人工處理。"
          exit 1
