# 建置並部署到 GitHub Pages，一個站台兩個版本：
#
#   /        main 分支，穩定版
#   /dev/    dev  分支，開發版（有橫幅與 noindex）
#
# Pages 一次只能部署一份成品，所以這裡把兩個分支都建出來再一起送。
# 推任一分支都會重建兩者，不會有一邊卡在舊版。
#
# 建置完全離線（只讀 data/），不會連到 Home Affairs 或 ABS——
# 資料更新是手動跑 `make update` 之後提交的，CI 不會偷偷改資料。
name: Build and deploy

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

# 自訂網域。填了會產生 CNAME 檔——用 Actions 部署時，自訂網域是靠成品裡的
# 這個檔決定的，只在 repo Settings 填而成品沒有，下次部署可能被洗掉。
#
# 目前留空，站台在 <帳號>.github.io/<repo>/。要綁網域時填上子網域，
# 並在 DNS 加一筆 CNAME 指到 <帳號>.github.io（Cloudflare 要設灰雲）。
env:
  CUSTOM_DOMAIN: ''

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 取出穩定版（main）
        uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 建置穩定版
        run: |
          make all
          make test
          mkdir -p /tmp/site
          cp dist/*.html /tmp/site/

      - name: 取出開發版（dev）
        id: devsrc
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: dev
          path: devsrc

      - name: 建置開發版
        if: steps.devsrc.outcome == 'success'
        env:
          CHANNEL: dev
        run: |
          make -C devsrc all
          mkdir -p /tmp/site/dev
          cp devsrc/dist/*.html /tmp/site/dev/

      - name: 加上 CNAME 與 robots.txt
        run: |
          if [ -n "$CUSTOM_DOMAIN" ]; then
            echo "$CUSTOM_DOMAIN" > /tmp/site/CNAME
          fi
          # 擋開發版被索引。注意：robots.txt 只有在網域根目錄才會被爬蟲讀到，
          # 專案站台在 /<repo>/ 底下時這個檔是無效的——真正在擋的是開發版頁面
          # 自己加的 noindex meta。等綁了自訂網域這個檔才會生效。
          printf 'User-agent: *\nDisallow: /dev/\n' > /tmp/site/robots.txt

      - uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
