# 建置並部署到 GitHub Pages。
#
# dist/ 不進版控，所以這裡負責產生它。建置完全離線（只讀 data/），
# 不會連到 Home Affairs 或 ABS——資料更新是手動跑 `make update` 後提交的。
name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 建置全部頁面
        run: make all

      - name: 跑測試
        run: make test

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
