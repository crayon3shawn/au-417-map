# 建置並部署到 GitHub Pages。站台只有一份，就是 main。
#
# 開發版不上線：本機 `CHANNEL=dev make all` 就能看到帶橫幅的版本，測完再推
# main。以前 /dev/ 是掛在站台上的第二條線，但那要多維護一整套東西（環境的
# 分支白名單、noindex、robots.txt），而目前的流程是「本機測完才推」，
# 那條線沒有存在的必要。
#
# 建置完全離線（只讀 data/），不會連到 Home Affairs 或 ABS——
# 資料更新是手動跑 `make update` 之後提交的，CI 不會偷偷改資料。
name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# 自訂網域。填了會產生 CNAME 檔——用 Actions 部署時，自訂網域是靠成品裡的
# 這個檔決定的，只在 repo Settings 填而成品沒有，下次部署可能被洗掉。
#
# 目前留空，站台在 <帳號>.github.io/<repo>/。要綁網域時填上子網域，
# 並在 DNS 加一筆 CNAME 指到 <帳號>.github.io（Cloudflare 要設灰雲）。
env:
  CUSTOM_DOMAIN: ''

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: 建置並測試
        run: |
          make all
          make test
          mkdir -p /tmp/site
          cp dist/*.html /tmp/site/

      - name: 加上 CNAME
        if: env.CUSTOM_DOMAIN != ''
        run: echo "$CUSTOM_DOMAIN" > /tmp/site/CNAME

      - uses: actions/upload-pages-artifact@v5
        with:
          path: /tmp/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
